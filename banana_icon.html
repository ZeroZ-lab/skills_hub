<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tropical Curvature - Banana Icon Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --banana-yellow: #FFD700;
            --banana-brown: #4B3621;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--anthropic-light); color: var(--anthropic-dark); overflow: hidden; }
        .container { display: flex; height: 100vh; padding: 20px; gap: 20px; }
        .sidebar { width: 320px; background: white; padding: 24px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow-y: auto; }
        h1 { font-family: 'Lora', serif; font-size: 22px; margin-bottom: 8px; }
        .subtitle { font-size: 13px; color: var(--anthropic-mid-gray); margin-bottom: 24px; line-height: 1.4; }
        .control-section { margin-bottom: 24px; }
        .control-section h3 { font-size: 14px; margin-bottom: 12px; color: var(--anthropic-orange); text-transform: uppercase; letter-spacing: 1px; }
        .control-group { margin-bottom: 16px; }
        .control-group label { display: block; font-size: 13px; margin-bottom: 6px; }
        .slider-container { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--anthropic-orange); }
        .value-display { font-family: monospace; font-size: 12px; width: 40px; text-align: right; }
        .canvas-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        #canvas-container { border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.1); background: #fff; line-height: 0; }
        .button { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-family: inherit; font-weight: 500; transition: 0.2s; margin-top: 8px; }
        .button.primary { background: var(--anthropic-orange); color: white; }
        .button.secondary { background: var(--anthropic-light-gray); color: var(--anthropic-dark); }
        .button:hover { opacity: 0.9; transform: translateY(-1px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Tropical Curvature</h1>
            <div class="subtitle">Generative Banana Icon designed for Tauri. Optimized for high contrast and organic geometry.</div>

            <div class="control-section">
                <h3>Form & Curve</h3>
                <div class="control-group">
                    <label>Curvature</label>
                    <div class="slider-container">
                        <input type="range" id="curvature" min="0.5" max="2.5" step="0.1" value="1.5" oninput="updateParam('curvature', this.value)">
                        <span class="value-display" id="curvature-value">1.5</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Thickness</label>
                    <div class="slider-container">
                        <input type="range" id="thickness" min="40" max="120" step="5" value="80" oninput="updateParam('thickness', this.value)">
                        <span class="value-display" id="thickness-value">80</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Ripeness</h3>
                <div class="control-group">
                    <label>Spot Density</label>
                    <div class="slider-container">
                        <input type="range" id="spots" min="0" max="100" step="1" value="30" oninput="updateParam('spots', this.value)">
                        <span class="value-display" id="spots-value">30</span>
                    </div>
                </div>
                <div class="control-group">
                    <label>Spot Scale</label>
                    <div class="slider-container">
                        <input type="range" id="spotScale" min="1" max="10" step="0.5" value="4" oninput="updateParam('spotScale', this.value)">
                        <span class="value-display" id="spotScale-value">4</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Style</h3>
                <div class="control-group">
                    <label>Background</label>
                    <input type="color" id="bgColor" value="#ffffff" style="width:100%; height:30px; border:none; border-radius:4px;" onchange="updateParam('bgColor', this.value)">
                </div>
                <div class="control-group">
                    <label>Icon Shape</label>
                    <select id="iconShape" style="width:100%; padding:8px;" onchange="updateParam('iconShape', this.value)">
                        <option value="circle">Circle</option>
                        <option value="square" selected>Square (Squircle)</option>
                    </select>
                </div>
            </div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" value="888" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; margin-bottom:10px;" onchange="updateSeed()">
                <button class="button secondary" onclick="randomize()">Randomize Seed</button>
            </div>

            <div class="control-section">
                <button class="button primary" onclick="downloadIcon()">Download 1024x1024 PNG</button>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container"></div>
        </div>
    </div>

    <script>
        let params = {
            seed: 888,
            curvature: 1.5,
            thickness: 80,
            spots: 30,
            spotScale: 4,
            bgColor: '#ffffff',
            iconShape: 'square'
        };

        function setup() {
            let canvas = createCanvas(1024, 1024);
            canvas.parent('canvas-container');
            // Scale down for preview
            canvas.style('width', '512px');
            canvas.style('height', '512px');
            noLoop();
            render();
        }

        function render() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            background(params.bgColor);
            
            translate(width/2, height/2);
            
            // Draw Icon Base
            if (params.iconShape === 'circle') {
                fill(250);
                noStroke();
                ellipse(0, 0, 960, 960);
            } else {
                fill(250);
                noStroke();
                rect(-480, -480, 960, 960, 180);
            }

            // Draw Shadow
            push();
            translate(10, 20);
            drawBanana(true);
            pop();
            
            // Draw Banana
            drawBanana(false);
        }

        function drawBanana(isShadow) {
            push();
            rotate(PI * -0.15); // Slight tilt for icon aesthetics
            
            let len = 600;
            let curve = params.curvature * 200;
            let thick = params.thickness;
            
            if (isShadow) {
                fill(0, 30);
                noStroke();
            } else {
                // Main Body Gradient
                noStroke();
            }

            // Core Points for the Arc
            let p1 = { x: -len/2, y: -curve/3 };
            let p2 = { x: 0, y: curve };
            let p3 = { x: len/2, y: -curve/3 };

            // Draw the peel
            if (!isShadow) {
                // Base yellow
                fill(255, 215, 0);
                beginShape();
                for (let t = 0; t <= 1; t += 0.01) {
                    let x = lerp(lerp(p1.x, p2.x, t), lerp(p2.x, p3.x, t), t);
                    let y = lerp(lerp(p1.y, p2.y, t), lerp(p2.y, p3.y, t), t);
                    let d = sin(t * PI) * thick;
                    vertex(x, y - d/2);
                }
                for (let t = 1; t >= 0; t -= 0.01) {
                    let x = lerp(lerp(p1.x, p2.x, t), lerp(p2.x, p3.x, t), t);
                    let y = lerp(lerp(p1.y, p2.y, t), lerp(p2.y, p3.y, t), t);
                    let d = sin(t * PI) * thick;
                    vertex(x, y + d/2);
                }
                endShape(CLOSE);

                // Add highlight
                fill(255, 255, 150, 100);
                beginShape();
                for (let t = 0.2; t <= 0.8; t += 0.01) {
                    let x = lerp(lerp(p1.x, p2.x, t), lerp(p2.x, p3.x, t), t);
                    let y = lerp(lerp(p1.y, p2.y, t), lerp(p2.y, p3.y, t), t);
                    let d = sin(t * PI) * thick * 0.4;
                    vertex(x, y - thick/3);
                }
                endShape();

                // Add spots
                fill(75, 54, 33, 180);
                for (let i = 0; i < params.spots; i++) {
                    let t = random(0.1, 0.9);
                    let x = lerp(lerp(p1.x, p2.x, t), lerp(p2.x, p3.x, t), t);
                    let y = lerp(lerp(p1.y, p2.y, t), lerp(p2.y, p3.y, t), t);
                    let d = sin(t * PI) * thick;
                    let offsetX = random(-d/2.5, d/2.5);
                    let offsetY = random(-d/2.5, d/2.5);
                    let s = random(2, params.spotScale * 3);
                    ellipse(x + offsetX, y + offsetY, s, s);
                }

                // Stem (Top)
                fill(101, 67, 33);
                push();
                translate(p1.x, p1.y);
                rotate(atan2(p2.y - p1.y, p2.x - p1.x) - PI/4);
                rect(-10, -30, 20, 40, 4);
                pop();

                // Tip (Bottom)
                fill(50, 30, 10);
                push();
                translate(p3.x, p3.y);
                rotate(atan2(p3.y - p2.y, p3.x - p2.x) + PI/4);
                ellipse(0, 0, 15, 10);
                pop();

            } else {
                beginShape();
                for (let t = 0; t <= 1; t += 0.01) {
                    let x = lerp(lerp(p1.x, p2.x, t), lerp(p2.x, p3.x, t), t);
                    let y = lerp(lerp(p1.y, p2.y, t), lerp(p2.y, p3.y, t), t);
                    let d = sin(t * PI) * thick;
                    vertex(x, y - d/2);
                }
                for (let t = 1; t >= 0; t -= 0.01) {
                    let x = lerp(lerp(p1.x, p2.x, t), lerp(p2.x, p3.x, t), t);
                    let y = lerp(lerp(p1.y, p2.y, t), lerp(p2.y, p3.y, t), t);
                    let d = sin(t * PI) * thick;
                    vertex(x, y + d/2);
                }
                endShape(CLOSE);
            }
            pop();
        }

        function updateParam(id, val) {
            params[id] = isNaN(val) ? val : parseFloat(val);
            document.getElementById(id + '-value').innerText = val;
            render();
        }

        function updateSeed() {
            params.seed = parseInt(document.getElementById('seed-input').value);
            render();
        }

        function randomize() {
            params.seed = Math.floor(random(1, 9999));
            document.getElementById('seed-input').value = params.seed;
            render();
        }

        function downloadIcon() {
            saveCanvas('banana-icon-1024', 'png');
        }
    </script>
</body>
</html>
